<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Illustrazione stilizzata di una colonna vertebrale, con una racchetta da padel e uno smartphone">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf4f9"/>
      <stop offset="1" stop-color="#cfe5ef"/>
    </linearGradient>
    <linearGradient id="bone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6edf2"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="110" cy="80" r="160" fill="#ffffff" opacity="0.35"/>
  <circle cx="1120" cy="590" r="220" fill="#ffffff" opacity="0.35"/>
  <circle cx="600" cy="315" r="290" fill="url(#glow)"/>

  <g fill="#1d6f8f" opacity="0.22">
    <circle cx="1060" cy="70" r="5"/><circle cx="1100" cy="70" r="5"/><circle cx="1140" cy="70" r="5"/>
    <circle cx="1060" cy="105" r="5"/><circle cx="1100" cy="105" r="5"/><circle cx="1140" cy="105" r="5"/>
    <circle cx="60" cy="560" r="5"/><circle cx="100" cy="560" r="5"/><circle cx="140" cy="560" r="5"/>
  </g>

  <!-- COLONNA VERTEBRALE (curva a S) -->
  <path d="M600 40 C 560 150, 650 250, 600 330 C 555 410, 640 500, 600 600" fill="none" stroke="#1d4f73" stroke-width="10" stroke-linecap="round" opacity="0.18"/>
  <g stroke="#9db6c6" stroke-width="3">
    <!-- vertebre: x segue la curva, larghezza crescente verso il basso -->
    <g transform="translate(594 62)"><rect x="-34" y="-15" width="68" height="30" rx="12" fill="url(#bone)"/><path d="M-34 0 H-54 M34 0 H54" stroke-linecap="round"/></g>
    <g transform="translate(588 104)"><rect x="-37" y="-16" width="74" height="32" rx="12" fill="url(#bone)"/><path d="M-37 0 H-58 M37 0 H58" stroke-linecap="round"/></g>
    <g transform="translate(596 147)"><rect x="-40" y="-17" width="80" height="34" rx="13" fill="url(#bone)"/><path d="M-40 0 H-62 M40 0 H62" stroke-linecap="round"/></g>
    <g transform="translate(612 191)"><rect x="-42" y="-17" width="84" height="34" rx="13" fill="url(#bone)"/><path d="M-42 0 H-65 M42 0 H65" stroke-linecap="round"/></g>
    <g transform="translate(624 236)"><rect x="-44" y="-18" width="88" height="36" rx="14" fill="url(#bone)"/><path d="M-44 0 H-68 M44 0 H68" stroke-linecap="round"/></g>
    <g transform="translate(618 282)"><rect x="-46" y="-18" width="92" height="36" rx="14" fill="url(#bone)"/><path d="M-46 0 H-70 M46 0 H70" stroke-linecap="round"/></g>
    <g transform="translate(600 329)"><rect x="-48" y="-19" width="96" height="38" rx="14" fill="url(#bone)"/><path d="M-48 0 H-72 M48 0 H72" stroke-linecap="round"/></g>
    <g transform="translate(582 377)"><rect x="-51" y="-20" width="102" height="40" rx="15" fill="url(#bone)"/><path d="M-51 0 H-76 M51 0 H76" stroke-linecap="round"/></g>
    <g transform="translate(580 426)"><rect x="-54" y="-21" width="108" height="42" rx="15" fill="url(#bone)"/><path d="M-54 0 H-80 M54 0 H80" stroke-linecap="round"/></g>
    <g transform="translate(594 476)"><rect x="-56" y="-22" width="112" height="44" rx="16" fill="url(#bone)"/><path d="M-56 0 H-82 M56 0 H82" stroke-linecap="round"/></g>
  </g>
  <!-- dischi intervertebrali -->
  <g fill="#2a8fa8" opacity="0.85">
    <rect x="566" y="80" width="46" height="7" rx="3.5"/>
    <rect x="566" y="122" width="52" height="7" rx="3.5"/>
    <rect x="577" y="166" width="56" height="7" rx="3.5"/>
    <rect x="590" y="210" width="58" height="7" rx="3.5"/>
    <rect x="593" y="255" width="58" height="7" rx="3.5"/>
    <rect x="579" y="302" width="60" height="7" rx="3.5"/>
    <rect x="559" y="350" width="62" height="7" rx="3.5"/>
    <rect x="549" y="399" width="64" height="7" rx="3.5"/>
    <rect x="554" y="449" width="66" height="7" rx="3.5"/>
  </g>
  <!-- osso sacro -->
  <path d="M548 510 Q 594 500 640 510 L 618 590 Q 594 606 570 590 Z" fill="url(#bone)" stroke="#9db6c6" stroke-width="3"/>

  <!-- RACCHETTA DA PADEL (sinistra) -->
  <g transform="translate(270 300) rotate(-24)">
    <rect x="-10" y="70" width="20" height="120" rx="9" fill="#1d4f73"/>
    <rect x="-13" y="150" width="26" height="46" rx="10" fill="#c4622d"/>
    <path d="M-95 -60 Q -95 -150 0 -150 Q 95 -150 95 -60 L 95 10 Q 95 85 0 85 Q -95 85 -95 10 Z" fill="#ffffff" stroke="#1d6f8f" stroke-width="8"/>
    <g fill="#9fc6d6">
      <circle cx="-40" cy="-90" r="7"/><circle cx="0" cy="-90" r="7"/><circle cx="40" cy="-90" r="7"/>
      <circle cx="-60" cy="-50" r="7"/><circle cx="-20" cy="-50" r="7"/><circle cx="20" cy="-50" r="7"/><circle cx="60" cy="-50" r="7"/>
      <circle cx="-40" cy="-10" r="7"/><circle cx="0" cy="-10" r="7"/><circle cx="40" cy="-10" r="7"/>
      <circle cx="-20" cy="30" r="7"/><circle cx="20" cy="30" r="7"/>
    </g>
  </g>
  <circle cx="390" cy="150" r="26" fill="#d9e85a" stroke="#b9c93f" stroke-width="3"/>
  <path d="M370 140 Q 390 152 410 140" fill="none" stroke="#ffffff" stroke-width="3"/>

  <!-- SMARTPHONE (destra) -->
  <g transform="translate(900 310) rotate(10)">
    <rect x="-80" y="-150" width="160" height="300" rx="26" fill="#1d4f73"/>
    <rect x="-68" y="-130" width="136" height="252" rx="14" fill="#ffffff"/>
    <rect x="-20" y="-143" width="40" height="6" rx="3" fill="#2a6a93"/>
    <rect x="-50" y="-105" width="100" height="12" rx="6" fill="#c9dbe5"/>
    <rect x="-50" y="-80" width="72" height="12" rx="6" fill="#c9dbe5"/>
    <!-- icona collo / postura -->
    <circle cx="0" cy="-12" r="22" fill="#2a8fa8"/>
    <path d="M0 10 Q 8 40 0 70" fill="none" stroke="#2a8fa8" stroke-width="12" stroke-linecap="round"/>
    <path d="M-40 92 H40" stroke="#c4622d" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- scintille -->
  <g fill="#ffc94d">
    <path d="M790 120 l7 18 18 7 -18 7 -7 18 -7 -18 -18 -7 18 -7z"/>
    <path d="M420 520 l6 15 15 6 -15 6 -6 15 -6 -15 -15 -6 15 -6z"/>
  </g>
</svg>
